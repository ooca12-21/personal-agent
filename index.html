<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f5ef"><title>Personal Agent · 给想法一个起点</title><style>
:root{--bg:#f5f5ef;--ink:#25332f;--muted:#728079;--green:#416a52;--line:#dedfd5;--pale:#e7eddf}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #9dba7e;outline-offset:3px}button{border:0;border-radius:12px;padding:12px 18px;background:var(--pale);color:var(--ink)}.primary{background:var(--green);color:white}.ghost{background:transparent;border:1px solid var(--line)}.shell{max-width:1100px;margin:auto;padding:28px 28px 110px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:17px;font-weight:700;letter-spacing:-.5px}.mark{display:inline-flex;border-radius:50%;background:var(--green);color:white;width:30px;height:30px;align-items:center;justify-content:center;margin-right:8px}.badge{font-size:12px;padding:4px 9px;border-radius:8px;background:#ece8d9;color:#72633d}.notice{font-size:12px;color:var(--muted);margin:14px 0 32px}h1{font-size:38px;line-height:1.25;font-weight:600;letter-spacing:-1.5px;margin:10px 0 14px}h2{font-size:19px;margin:0 0 12px}h3{font-size:16px;margin:0}.eyebrow{color:var(--green);font-size:12px;letter-spacing:2px}.muted{color:var(--muted)}.hero{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:28px}.hero p{margin:0}.circle{width:100px;height:100px;border-radius:50%;background:conic-gradient(var(--green) var(--progress),#e2e6d9 0);display:grid;place-items:center;flex-shrink:0}.circle div{height:80px;width:80px;border-radius:50%;background:var(--bg);display:grid;place-content:center;text-align:center;font-size:23px}.circle small{font-size:10px;color:var(--muted)}.grid{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(260px,1fr);gap:24px}.card{background:#fffefa;border:1px solid var(--line);border-radius:20px;padding:24px;margin-bottom:18px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}.section-head h2{margin:0}.task{padding:18px 0;border-top:1px solid var(--line);display:flex;gap:14px}.task input{width:21px;height:21px;accent-color:var(--green);flex-shrink:0;margin-top:5px}.task-main{flex:1;min-width:0}.task.done h3{text-decoration:line-through;color:var(--muted)}.tag{display:inline-block;font-size:11px;background:var(--pale);color:var(--green);padding:3px 8px;border-radius:6px;margin:7px 0}.task p{font-size:13px;margin:6px 0;color:var(--muted)}details{font-size:12px;color:var(--muted);margin-top:6px}summary{cursor:pointer}.date-line{font-size:12px;margin-bottom:5px;color:var(--green)}.goal-name{font-size:19px;line-height:1.6;margin:10px 0}.bar{height:6px;border-radius:9px;background:var(--pale);margin:18px 0}.bar div{background:var(--green);height:100%;border-radius:9px}.small{font-size:12px}.nav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#253b30;border-radius:18px;display:flex;padding:7px;gap:5px;box-shadow:0 8px 30px #253b3025;z-index:10}.nav button{color:#c7d3c6;background:transparent;white-space:nowrap;padding:10px 23px}.nav button.active{background:#48634f;color:white}label{display:block;font-size:13px;margin:14px 0 6px}input:not([type=checkbox]),textarea,select{width:100%;background:#fffefa;border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--ink);min-width:0}textarea{resize:vertical;min-height:95px}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.empty{text-align:center;padding:35px 12px;color:var(--muted)}.banner{border-left:3px solid #b59e67;padding:10px 15px;background:#f4efe1;font-size:12px;border-radius:5px}.plan-day{border-bottom:1px solid var(--line);padding:18px 0}.plan-day:last-child{border:0}dialog{border:1px solid var(--line);border-radius:20px;width:min(620px,94vw);max-height:85vh;background:var(--bg);color:var(--ink);padding:25px}dialog::backdrop{background:#24332c75}.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:12px 20px;border-radius:12px;z-index:30;max-width:90vw}.hidden{display:none}.draft-task{border-top:1px solid var(--line);padding:10px 0}.footer{margin-top:20px;font-size:11px;color:var(--muted)}@media(max-width:700px){.shell{padding:22px 18px 110px}.grid{grid-template-columns:1fr;gap:0}h1{font-size:30px}.card{padding:20px}.circle{width:80px;height:80px}.circle div{width:64px;height:64px;font-size:19px}.hero{gap:12px}.nav{bottom:calc(12px + env(safe-area-inset-bottom));width:calc(100% - 36px);justify-content:space-around}.nav button{padding:10px 18px;flex:1}.row{gap:10px}.notice{margin-bottom:24px}.top .badge{font-size:10px}}
</style></head><body><main class="shell"><header class="top"><div class="brand"><span class="mark">↗</span>Personal Agent</div><span class="badge">交互原型 · 示例计划</span></header><p class="notice">把想法变成下一步。此版未接入 AI，数据仅保存在当前浏览器。</p><div id="view"></div><p class="footer">你的节奏比完美的计划更重要。</p></main><nav class="nav" aria-label="主导航"><button data-page="today">今日</button><button data-page="plan">计划</button><button data-page="create">＋ 目标</button></nav><dialog id="modal"></dialog><div id="toast" class="toast hidden" role="status"></div>
<script>
const $=s=>document.querySelector(s),escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function dateNow(){return new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}function addDays(date,n){const d=new Date(date+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
const templates=[['确认综述范围与导师要求','打开一份空白文档，写下三个需要确认的问题。','记录研究问题、综述范围及篇幅要求；未知项明确标注。',45,0],['筛选已有五篇文献','打开文献列表，记录第一篇的标题。','为五篇文献记录主题、相关性及阅读状态。',90,0],['搭建文献笔记模板','新建文档，写下“方法、发现、局限”三个标题。','建立可重复使用的笔记模板，整理已读的一篇。',45,0],['定位文献缺口与补充检索','查看现有文献，列出一个尚未覆盖的主题。','记录检索词、筛选规则和待阅读清单，不以数量代替充分性。',180,1],['阅读并整理关键文献','打开优先级最高的未读文献摘要。','形成方法、发现、局限与相关性笔记，标出引用出处。',180,2],['比较主题并形成提纲','把两个研究观点放在同一个文档中。','得到主题提纲、研究之间的关系和待核实的研究缺口。',180,3],['完成英文综述初稿','打开提纲，写下第一段的中心句。','按主题完成各节初稿，用已核对的文献支撑论点。',180,4],['修改结构与论证','阅读初稿的每段第一句。','检查段落衔接、文献比较及与研究问题的联系。',180,5],['核对引用并准备导师版本','找到第一处引用，对照文献笔记核实。','核对引用、简化英文表达，整理待讨论问题。',180,6]];
function makeTasks(start){return templates.map((t,i)=>({id:'t'+Date.now()+i,title:t[0],step:t[1],standard:t[2],minutes:t[3],date:addDays(start,t[4]),done:false}))}
let state={goal:null,tasks:[]},page='today',draft=null;try{const saved=JSON.parse(localStorage.getItem('pa-prototype-v1'));if(saved&&Array.isArray(saved.tasks))state=saved}catch{}let storageWarning=false;
function save(){try{localStorage.setItem('pa-prototype-v1',JSON.stringify(state))}catch{storageWarning=true;toast('当前浏览器无法保存，关闭后可能丢失数据。')}}function toast(s){$('#toast').textContent=s;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),3500)}
function taskHtml(t){return `<article class="task ${t.done?'done':''}"><input type="checkbox" aria-label="完成 ${escape(t.title)}" data-task="${escape(t.id)}" ${t.done?'checked':''}><div class="task-main"><h3>${escape(t.title)}</h3><span class="tag">${t.minutes} 分钟</span><p>↗ 5 分钟起步：${escape(t.step)}</p><details><summary>怎样算完成？</summary>${escape(t.standard)}</details></div></article>`}
function render(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const goal=state.goal,total=state.tasks.length,done=state.tasks.filter(t=>t.done).length,pct=total?Math.round(done/total*100):0,today=dateNow();let h='';if(page==='today'){let tasks=state.tasks.filter(t=>t.date===today),mins=tasks.filter(t=>!t.done).reduce((a,t)=>a+t.minutes,0),overdue=state.tasks.filter(t=>!t.done&&t.date<today).length;h=`<section class="hero"><div><span class="eyebrow">${today} · 今天</span><h1>从小小一步开始。</h1><p class="muted">${goal?'不必一次做完，只需要知道下一步。':'给一个想法留出时间，让它慢慢发生。'}</p></div><div class="circle" style="--progress:${pct}%"><div>${pct}%<small>整体进度</small></div></div></section><div class="grid"><section class="card"><div class="section-head"><h2>今日行动</h2><span class="small muted">待完成 ${mins} 分钟</span></div>${tasks.length?tasks.map(taskHtml).join(''):`<div class="empty">${goal?'今天没有已安排任务。可以在计划页查看或调整。':'还没有计划。先用论文目标体验一次。'}<div class="actions" style="justify-content:center"><button class="primary" data-action="example">体验论文示例</button></div></div>`}${overdue?`<p class="banner">有 ${overdue} 项未完成任务已过安排日期，请到计划页调整。</p>`:''}</section><aside><section class="card"><span class="eyebrow">正在靠近的目标</span><div class="goal-name">${goal?escape(goal.title):'一周完成英文文献综述'}</div><p class="small muted">${goal?'截止 '+goal.deadline:'从你的真实目标开始，先确认示例计划。'}</p><div class="bar"><div style="width:${pct}%"></div></div><p class="small muted">${done} / ${total} 项任务完成</p><button class="ghost" data-action="plan">查看计划 ↗</button></section><section class="card"><h2>留一点余地</h2><p class="muted small">基本安排按每天 3 小时设计，额外时间用于补充阅读和缓冲。计划是草案，时间不足时可以调整。</p></section></aside></div>`}
if(page==='plan'){h=`<span class="eyebrow">你的方向</span><h1>计划可以改变。</h1>${goal?`<section class="card"><h2>${escape(goal.title)}</h2><p class="muted">${escape(goal.description)}</p><div class="banner">示例计划 · 未由 AI 生成。篇幅与研究范围待确认；这份安排不保证一周能满足导师要求。</div><p class="small">截止 ${goal.deadline} · 每天 ${goal.hours} 小时 · ${done}/${total} 项完成</p><div class="actions"><button class="primary" data-action="adjust">调整未完成任务</button><button class="ghost" data-action="export">导出记录</button></div></section><section class="card">${[...new Set(state.tasks.map(t=>t.date))].sort().map(d=>`<div class="plan-day"><div class="section-head"><h2>${d}</h2><span class="small muted">${state.tasks.filter(t=>t.date===d).reduce((a,t)=>a+t.minutes,0)} 分钟</span></div>${state.tasks.filter(t=>t.date===d).map(taskHtml).join('')}</div>`).join('')}</section>`:`<section class="card empty">还没有确认的计划。<div class="actions" style="justify-content:center"><button class="primary" data-action="example">体验论文示例</button></div></section>`}`}
if(page==='create'){h=`<span class="eyebrow">给想法一个起点</span><h1>你想完成什么？</h1><section class="card" style="max-width:720px"><div class="banner">本原型只提供论文综述示例模板，不会为其他目标自动生成任务。</div><form id="goal-form"><label for="title">目标名称</label><input id="title" name="title" required value="完成英文 literature review"><label for="description">想法与交付要求</label><textarea id="description" name="description">中国出海科技企业危机公关的叙事策略研究。给导师看的完整版本，英文简洁易读；字数待确认。</textarea><label for="current">当前进度</label><textarea id="current" name="current">粗略完成 pilot study；收集5篇文献，读了1篇，没有提纲和初稿。</textarea><div class="row"><div><label for="start">开始日期</label><input id="start" name="start" type="date" value="${today}" required></div><div><label for="deadline">截止日期</label><input id="deadline" name="deadline" type="date" value="${addDays(today,6)}" required></div></div><label for="hours">每天基本可用时间（小时）</label><input id="hours" name="hours" type="number" min="1" max="12" step="0.5" value="3" required><div class="actions"><button type="submit" class="primary">预览论文示例计划 ↗</button></div><p class="small muted">先检查并修改任务，再确认保存。正式 AI 补问功能将在后续加入。</p></form></section>`}$('#view').innerHTML=h;if(storageWarning)$('#view').insertAdjacentHTML('afterbegin','<div class="banner">浏览器保存不可用，请使用导出记录保留进度。</div>')}
function showDraft(data){draft=data;const modal=$('#modal');modal.innerHTML=`<div class="section-head"><h2>确认计划草案</h2><button data-action="close" aria-label="关闭">✕</button></div><p class="small muted">示例模板，非 AI 生成。可以编辑任务名称、日期与耗时。</p><div class="banner">研究问题、综述篇幅及文献覆盖仍需确认。${state.goal?'确认后将替换当前原型计划及完成记录；可先导出旧记录。':''}</div><form id="draft-form">${data.tasks.map((t,i)=>`<div class="draft-task"><label for="dt${i}">任务 ${i+1}</label><input id="dt${i}" name="title${i}" value="${escape(t.title)}" required><div class="row"><input aria-label="任务${i+1}日期" name="date${i}" type="date" value="${t.date}" required><input aria-label="任务${i+1}分钟数" name="minutes${i}" type="number" min="5" step="5" value="${t.minutes}" required></div><p class="small muted">起步：${escape(t.step)}</p><details><summary>完成标准</summary>${escape(t.standard)}</details></div>`).join('')}<p id="draft-error" class="banner hidden"></p><div class="actions"><button type="submit" class="primary">确认并保存计划</button><button type="button" data-action="close" class="ghost">暂不保存</button></div></form>`;modal.showModal()}
function adjust(){const modal=$('#modal');modal.innerHTML=`<div class="section-head"><h2>给计划一点空间</h2><button data-action="close">✕</button></div><p class="muted small">此版用规则演示调整，尚不能理解任意自然语言。已完成任务和截止日期不变。</p><label for="shift">调整方式</label><select id="shift"><option value="1">未完成任务延后一天</option><option value="2">未完成任务延后两天</option></select><div class="actions"><button class="primary" data-action="preview-adjust">预览变化</button></div><div id="adjust-preview"></div>`;modal.showModal()}
let shifts=null;document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;render();window.scrollTo(0,0)}const a=b.dataset.action;if(a==='example'){page='create';render();window.scrollTo(0,0)}if(a==='plan'){page='plan';render()}if(a==='close')$('#modal').close();if(a==='adjust')adjust();if(a==='export'){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),link=document.createElement('a');link.href=u;link.download='personal-agent-records.json';link.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}if(a==='preview-adjust'){const n=Number($('#shift').value);shifts=state.tasks.filter(t=>!t.done).map(t=>({...t,date:addDays(t.date,n)}));const conflict=shifts.some(t=>t.date>state.goal.deadline);$('#adjust-preview').innerHTML=`<h3 style="margin-top:20px">${shifts.length} 项任务将调整</h3>${shifts.map(t=>`<p class="small">${escape(t.title)}<br><span class="muted">${state.tasks.find(o=>o.id===t.id).date} → ${t.date}</span></p>`).join('')}${conflict?'<div class="banner">调整后部分任务超过原截止日期。截止日期不会自动改变；这份计划存在期限冲突。</div>':''}<div class="actions"><button class="primary" data-action="apply-adjust" ${!shifts.length?'disabled':''}>${conflict?'接受期限冲突并保存调整':'确认调整'}</button><button class="ghost" data-action="close">取消</button></div>`}if(a==='apply-adjust'&&shifts){state.tasks=state.tasks.map(t=>shifts.find(s=>s.id===t.id)||t);save();$('#modal').close();render();toast('已调整未完成任务，截止日期保持原样。')}});
document.addEventListener('change',e=>{if(e.target.dataset.task){const t=state.tasks.find(t=>t.id===e.target.dataset.task);t.done=e.target.checked;save();render();toast(t.done?'完成一步，慢慢向前。':'已撤销完成。')}});
document.addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);if(e.target.id==='goal-form'){if(f.get('deadline')<f.get('start')){toast('截止日期不能早于开始日期。');return}showDraft({goal:{title:f.get('title'),description:f.get('description'),current:f.get('current'),deadline:f.get('deadline'),hours:Number(f.get('hours'))},tasks:makeTasks(f.get('start'))})}if(e.target.id==='draft-form'){const tasks=draft.tasks.map((t,i)=>({...t,title:f.get('title'+i),date:f.get('date'+i),minutes:Number(f.get('minutes'+i))})),limit=draft.goal.hours*60,issues=[];for(const day of new Set(tasks.map(t=>t.date))){const sum=tasks.filter(t=>t.date===day).reduce((a,t)=>a+t.minutes,0);if(sum>limit)issues.push(day+' 安排 '+sum+' 分钟，超过每日 '+limit+' 分钟。')}if(tasks.some(t=>t.date>draft.goal.deadline))issues.push('部分任务晚于截止日期，请调整日期或返回修改期限。');if(issues.length){$('#draft-error').textContent=issues.join(' ');$('#draft-error').classList.remove('hidden');return}state={goal:draft.goal,tasks};save();$('#modal').close();page='today';render();toast('计划已确认，开始你的第一步。')}});render();
</script></body></html>
