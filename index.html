display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}.section-head h2{margin:0}.task{padding:18px 0;border-top:1px solid var(--line);display:flex;gap:14px}.task input{width:21px;height:21px;accent-color:var(--green);flex-shrink:0;margin-top:5px}.task-main{flex:1;min-width:0}.task.done h3{text-decoration:line-through;color:var(--muted)}.tag{display:inline-block;font-size:11px;background:var(--pale);color:var(--green);padding:3px 8px;border-radius:6px;margin:7px 0}.task p{font-size:13px;margin:6px 0;color:var(--muted)}details{font-size:12px;color:var(--muted);margin-top:6px}summary{cursor:pointer}.date-line{font-size:12px;margin-bottom:5px;color:var(--green)}.goal-name{font-size:19px;line-height:1.6;margin:10px 0}.bar{height:6px;border-radius:9px;background:var(--pale);margin:18px 0}.bar div{background:var(--green);height:100%;border-radius:9px}.small{font-size:12px}.nav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#253b30;border-radius:18px;display:flex;padding:7px;gap:5px;box-shadow:0 8px 30px #253b3025;z-index:10}.nav button{color:#c7d3c6;background:transparent;white-space:nowrap;padding:10px 23px}.nav button.active{background:#48634f;color:white}label{display:block;font-size:13px;margin:14px 0 6px}input:not([type=checkbox]),textarea,select{width:100%;background:#fffefa;border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--ink);min-width:0}textarea{resize:vertical;min-height:95px}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.empty{text-align:center;padding:35px 12px;color:var(--muted)}.banner{border-left:3px solid #b59e67;padding:10px 15px;background:#f4efe1;font-size:12px;border-radius:5px}.plan-day{border-bottom:1px solid var(--line);padding:18px 0}.plan-day:last-child{border:0}dialog{border:1px solid var(--line);border-radius:20px;width:min(620px,94vw);max-height:85vh;background:var(--bg);color:var(--ink);padding:25px}dialog::backdrop{background:#24332c75}.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:12px 20px;border-radius:12px;z-index:30;max-width:90vw}.hidden{display:none}.draft-task{border-top:1px solid var(--line);padding:10px 0}.footer{margin-top:20px;font-size:11px;color:var(--muted)}@media(max-width:700px){.shell{padding:22px 18px 110px}.grid{grid-template-columns:1fr;gap:0}h1{font-size:30px}.card{padding:20px}.circle{width:80px;height:80px}.circle div{width:64px;height:64px;font-size:19px}.hero{gap:12px}.nav{bottom:calc(12px + env(safe-area-inset-bottom));width:calc(100% - 36px);justify-content:space-around}.nav button{padding:10px 18px;flex:1}.row{gap:10px}.notice{margin-bottom:24px}.top .badge{font-size:10px}}

.task .subcheck{width:18px;height:18px;margin:4px 8px 0 0}.subtask{display:flex;align-items:flex-start;font-size:13px;padding:7px 0}.subtask.completed span{text-decoration:line-through;color:var(--muted)}.task-tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:10px}.task-tools button{padding:6px 10px;font-size:12px}.rule-list{padding-left:20px;line-height:1.9;margin:10px 0}.break-row{display:flex;gap:8px;align-items:center;margin:10px 0}.break-row button{padding:10px;flex-shrink:0}.subtask-body{flex:1;min-width:0}.subtask-edit{font-size:11px;padding:4px 8px;margin-left:8px}.subtask-meta{display:block;font-size:11px;color:var(--muted)}.task .encouragement{font-style:italic;margin:8px 0 12px}.section-head .small{white-space:nowrap}.window-note{margin:0 0 20px}.main-column{max-width:780px;margin:auto}.nav button{min-width:130px}
</style></head><body><main class="shell"><header class="top"><div class="brand"><span class="mark">↗</span>Personal Agent</div><span class="badge">自己的节奏</span></header><p class="notice">记录想法，慢慢向前。数据保存在当前浏览器。</p><div id="view" class="main-column"></div><p class="footer">你的节奏比完美的计划更重要。</p></main><nav class="nav" aria-label="主导航"><button data-page="home">首页</button><button data-page="plan">计划汇总</button></nav><dialog id="modal"></dialog><div id="toast" class="toast hidden" role="status"></div><script src="rules.js?v=20261012-duration"></script><script>
const $=s=>document.querySelector(s),escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function dateNow(){return new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function addDays(d,n){return TaskRules.add(d,n)}
function uid(){return 't'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
let state={goal:null,tasks:[]},page='home',storageWarning=false,rawInput='',breakTaskId=null;
try{const old=JSON.parse(localStorage.getItem('pa-prototype-v1'));if(old&&Array.isArray(old.tasks))state=old}catch{}
function save(){try{localStorage.setItem('pa-prototype-v1',JSON.stringify(state))}catch{storageWarning=true;toast('浏览器暂时无法保存，请导出记录。')}}
function toast(message){$('#toast').textContent=message;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),4000)}
function ownDay(t,d){return !!t.date&&(t.endDate?t.date<=d&&t.endDate>=d:t.date===d)}
function onDay(t,d){return ownDay(t,d)||(t.subtasks||[]).some(s=>ownDay(s,d))}
function taskHtml(t,day=page==='home'?dateNow():null){const all=t.subtasks||[],subs=all.filter(s=>day==='pending'?s.date==='':!day||!s.date||ownDay(s,day)),done=all.filter(s=>s.done).length;return `<article class="task ${t.done?'done':''}"><input type="checkbox" aria-label="完成 ${escape(t.title)}" data-task="${escape(t.id)}" ${t.done?'checked':''}><div class="task-main"><h3>${escape(t.title)}</h3>${t.important?'<span class="tag">重要</span>':''}${t.endDate?`<span class="tag">${t.date} 至 ${t.endDate}</span>`:''}${t.time?`<span class="tag">${escape(t.time)}${t.before?'前':''}</span>`:''}<p class="encouragement">Take your time.</p>${subs.map(s=>`<div class="subtask ${s.done?'completed':''}"><input class="subcheck" type="checkbox" aria-label="完成子任务 ${escape(s.title)}" data-parent="${escape(t.id)}" data-subtask="${escape(s.id)}" ${s.done?'checked':''}><div class="subtask-body"><span>${escape(s.title)}</span><small class="subtask-meta">${escape(s.date||'待安排')}${s.endDate?' 至 '+escape(s.endDate):''}${s.time?' · '+escape(s.time)+(s.before?'前':''):''}</small></div><button class="ghost subtask-edit" data-action="edit-sub" data-id="${escape(t.id)}" data-sub-id="${escape(s.id)}" aria-label="修改子任务 ${escape(s.title)}">修改</button><button class="ghost subtask-edit" data-action="delete-sub" data-id="${escape(t.id)}" data-sub-id="${escape(s.id)}" aria-label="删除子任务 ${escape(s.title)}">删除</button></div>`).join('')}${all.length?`<p class="small muted">子任务 ${done} / ${all.length} 完成${day?' · 本栏显示 '+subs.length+' 项':''}</p>`:''}${page==='home'?`<div class="task-tools"><button class="ghost" data-action="breakdown" data-id="${escape(t.id)}">任务拆解</button><button class="ghost" data-action="edit" data-id="${escape(t.id)}">修改任务</button></div>`:''}<div class="task-tools"><button class="ghost" data-action="delete-task" data-id="${escape(t.id)}" aria-label="删除任务 ${escape(t.title)}">删除任务</button></div></div></article>`}
function inputCard(){return `<section class="card"><h2>把想法放下来</h2><form id="rules-form"><label for="raw-tasks">想做些什么？</label><textarea id="raw-tasks" name="raw" required placeholder="今天洗衣服&#10;明天读论文&#10;从今天开始，接下来一周完成文献综述">${escape(rawInput)}</textarea><details><summary>支持哪些规则？</summary><ul class="rule-list"><li>日期：今天、明天、周三、10月20日。</li><li>重复：每天、工作日、周末（先安排七天）。</li><li>范围：今天到周五；往后一周、未来7天内。</li><li>多件事：用换行或逗号分开；无日期进入待安排。</li></ul></details><div class="actions"><button class="primary" type="submit">添加待办 →</button></div><p id="rules-error" class="banner hidden" role="alert"></p></form></section>`}
function render(){const today=dateNow();document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let h='';if(page==='home'){const tasks=state.tasks.filter(t=>onDay(t,today)),done=tasks.filter(t=>t.done).length;h=`<span class="eyebrow">${today}</span><h1>从一个想法开始。</h1>${inputCard()}<section class="card"><div class="section-head"><h2>今日待办</h2><span class="small muted">${done} / ${tasks.length} 完成</span></div>${tasks.length?tasks.map(t=>taskHtml(t)).join(''):'<p class="empty">今天还没有安排，写下一件想做的事吧。</p>'}</section>`}else{const dates=Array.from({length:8},(_,i)=>addDays(today,i)),pending=state.tasks.filter(t=>!t.date||(t.subtasks||[]).some(s=>s.date==='')),outside=state.tasks.filter(t=>(t.date&&!dates.some(d=>ownDay(t,d)))||(t.subtasks||[]).some(s=>s.date&&!dates.some(d=>ownDay(s,d))));h=`<span class="eyebrow">留一点空间</span><h1>计划汇总。</h1><p class="muted window-note">今天与未来七天 · 持续任务每天显示，进度同步。</p><section class="card">${dates.map((d,i)=>{const tasks=state.tasks.filter(t=>onDay(t,d));return `<section class="plan-day"><div class="section-head"><h2>${i===0?'今天':i===1?'明天':d}</h2><span class="small muted">${i<2?d:tasks.length+' 项'}</span></div>${tasks.length?tasks.map(t=>taskHtml(t,d)).join(''):'<p class="small muted">留白，也是一种安排。</p>'}</section>`}).join('')}</section>${pending.length?`<section class="card"><h2>待安排</h2>${pending.map(t=>taskHtml(t,t.date?'pending':null)).join('')}</section>`:''}${outside.length?`<details class="card"><summary>其他日期的任务 · ${outside.length} 项</summary>${outside.map(t=>`<div class="date-line">${escape(t.date)}${t.endDate?' 至 '+escape(t.endDate):''}</div>${taskHtml(t)}`).join('')}</details>`:''}<button class="ghost" data-action="export">导出记录</button>`}if(page==='plan'&&(state.trash||[]).length){h+=`<details class="card"><summary>已删除任务 · ${state.trash.length} 项</summary>${state.trash.map(r=>`<div class="section-head"><span>${r.parentId?'子任务：':'任务：'}${escape(r.task.title)}</span><button class="ghost" data-action="restore" data-trash-id="${escape(r.id)}" aria-label="还原 ${escape(r.task.title)}">还原</button></div>`).join('')}</details>`}$('#view').innerHTML=h;if(storageWarning)$('#view').insertAdjacentHTML('afterbegin','<p class="banner">浏览器保存不可用，请导出记录保留进度。</p>')}
function breakdown(id){const task=state.tasks.find(t=>t.id===id);if(!task)return;breakTaskId=id;$('#modal').innerHTML=`<div class="section-head"><h2>任务拆解</h2><button type="button" data-action="close" aria-label="关闭">✕</button></div><p class="muted">${escape(task.title)}</p><form id="break-form"><label for="break-text">细化你的任务</label><textarea id="break-text" name="raw" required placeholder="细化你的任务，如：今天10点前读完xxx文章，明天把两个理论联系起来..."></textarea><p class="small muted">按日期安排子任务，未写日期或只写时间，默认安排在今天；写了日期则按输入安排，不自动顺延。</p><p id="break-error" class="banner hidden" role="alert"></p><div class="actions"><button class="primary" type="submit">添加子任务 →</button><button type="button" class="ghost" data-action="close">取消</button></div></form>`;$('#modal').showModal()}
function editTask(id,subId){const parent=state.tasks.find(t=>t.id===id),t=subId?parent?.subtasks?.find(s=>s.id===subId):parent;if(!t)return;$('#modal').innerHTML=`<div class="section-head"><h2>${subId?'修改子任务':'修改任务'}</h2><button type="button" data-action="close" aria-label="关闭">✕</button></div><form id="edit-form" data-id="${escape(id)}" data-sub-id="${escape(subId||'')}"><label for="edit-title">任务名称</label><input id="edit-title" name="title" value="${escape(t.title)}" required><label for="edit-date">安排日期（留空表示待安排）</label><input type="date" id="edit-date" name="date" value="${escape(t.date||'')}"><label for="edit-end">持续到（单日任务留空）</label><input type="date" id="edit-end" name="endDate" value="${escape(t.endDate||'')}"><label for="edit-time">时间（可选）</label><input type="time" id="edit-time" name="time" value="${escape(t.time||'')}"><label><input type="checkbox" name="before" ${t.before?'checked':''}> 在此时间前完成</label><p id="edit-error" class="banner hidden" role="alert"></p><div class="actions"><button type="submit" class="primary">保存修改</button><button type="button" class="ghost" data-action="close">取消</button></div></form>`;$('#modal').showModal()}
function deleteTask(id,subId){const parent=state.tasks.find(t=>t.id===id);if(!parent)return;state.trash=state.trash||[];if(subId){const index=(parent.subtasks||[]).findIndex(t=>t.id===subId);if(index<0)return;state.trash.push({id:uid(),parentId:id,index,task:parent.subtasks.splice(index,1)[0]})}else{const index=state.tasks.findIndex(t=>t.id===id);state.trash.push({id:uid(),index,task:state.tasks.splice(index,1)[0]})}save();render();toast('已删除，可到计划汇总的“已删除任务”中还原。')}
function restoreTask(id){const index=(state.trash||[]).findIndex(r=>r.id===id);if(index<0)return;const record=state.trash[index];if(record.parentId){const parent=state.tasks.find(t=>t.id===record.parentId);if(!parent){toast('请先还原这个子任务所属的大任务。');return}parent.subtasks=parent.subtasks||[];parent.subtasks.splice(Math.min(record.index,parent.subtasks.length),0,record.task)}else state.tasks.splice(Math.min(record.index,state.tasks.length),0,record.task);state.trash.splice(index,1);save();render();toast('已还原任务及其完成状态。')}
document.addEventListener('input',e=>{if(e.target.id==='raw-tasks')rawInput=e.target.value});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;render();window.scrollTo(0,0)}const a=b.dataset.action;if(a==='delete-task')deleteTask(b.dataset.id);if(a==='delete-sub')deleteTask(b.dataset.id,b.dataset.subId);if(a==='restore')restoreTask(b.dataset.trashId);if(a==='close')$('#modal').close();if(a==='breakdown')breakdown(b.dataset.id);if(a==='edit')editTask(b.dataset.id);if(a==='edit-sub')editTask(b.dataset.id,b.dataset.subId);if(a==='export'){const u=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'})),link=document.createElement('a');link.href=u;link.download='personal-agent-records.json';link.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}});
document.addEventListener('change',e=>{if(e.target.dataset.subtask){const t=state.tasks.find(t=>t.id===e.target.dataset.parent),s=t?.subtasks?.find(s=>s.id===e.target.dataset.subtask);if(s){s.done=e.target.checked;save();render()}}else if(e.target.dataset.task){const t=state.tasks.find(t=>t.id===e.target.dataset.task);if(t){t.done=e.target.checked;save();render();toast(t.done?'完成一步，慢慢向前。':'已撤销完成。')}}});
document.addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);if(e.target.id==='rules-form'){const r=TaskRules.parse(f.get('raw'),dateNow());if(r.errors.length||!r.tasks.length){$('#rules-error').textContent=r.errors.join(' ')||'请补充要做的事情。';$('#rules-error').classList.remove('hidden');return}const keys=new Set(state.tasks.map(t=>t.title+'\0'+(t.date||'')+'\0'+(t.endDate||'')+'\0'+(t.time||'')));let count=0;r.tasks.forEach(t=>{const key=t.title+'\0'+t.date+'\0'+(t.endDate||'')+'\0'+(t.time||'');if(keys.has(key))return;keys.add(key);state.tasks.push({...t,id:uid(),subtasks:[]});count++});save();rawInput='';render();toast((count?'已添加 '+count+' 项待办。':'相同任务已存在。')+(r.warnings.length?' 部分日期未识别，已放入待安排，可修改任务日期。':''))}if(e.target.id==='break-form'){const t=state.tasks.find(t=>t.id===breakTaskId);if(!t)return;const r=TaskRules.parse(f.get('raw'),dateNow(),{defaultToday:true,inherit:false});if(r.errors.length||!r.tasks.length){$('#break-error').textContent=r.errors.join(' ')||'请写下具体步骤。';$('#break-error').classList.remove('hidden');return}t.subtasks=t.subtasks||[];const keys=new Set(t.subtasks.map(s=>s.title+'\0'+(s.date||'')+'\0'+(s.endDate||'')+'\0'+(s.time||'')));let count=0;r.tasks.forEach(s=>{const key=s.title+'\0'+s.date+'\0'+(s.endDate||'')+'\0'+(s.time||'');if(keys.has(key))return;keys.add(key);t.subtasks.push({...s,id:uid()});count++});save();$('#modal').close();render();toast((count?'已添加 '+count+' 项子任务。':'相同子任务已存在。')+(r.warnings.length?' 未识别的日期已放入待安排。':''))}if(e.target.id==='edit-form'){const parent=state.tasks.find(t=>t.id===e.target.dataset.id),t=e.target.dataset.subId?parent?.subtasks?.find(s=>s.id===e.target.dataset.subId):parent,date=String(f.get('date')||''),endDate=String(f.get('endDate')||'');if(endDate&&(!date||endDate<date)){const err=$('#edit-error');err.textContent='持续任务需要开始日期，结束日期不能早于开始日期。';err.classList.remove('hidden');return}t.title=String(f.get('title')).trim();t.date=date;t.endDate=endDate;t.time=String(f.get('time')||'');t.before=!!f.get('before');save();$('#modal').close();render();toast('已修改任务。')}});if(!state.subtaskDateDefaultsApplied){let changed=false;state.tasks.forEach(t=>(t.subtasks||[]).forEach(s=>{if(!s.date){s.date=dateNow();changed=true}}));state.subtaskDateDefaultsApplied=true;save()}render();
</script></body></html>
